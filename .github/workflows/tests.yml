name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif
          coverage: none

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Lint
        run: php -l image_resize.php && php -l tests/run.php

      - name: Test with GD
        run: php tests/run.php gd

      - name: Test with ImageMagick
        run: php tests/run.php magick

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the web app's sizing and naming rules
        run: node --test tests/web.test.mjs
      - name: Check the web app's JavaScript
        run: node --check web/app.js
